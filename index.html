<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Professional bandwidth, data transfer speed, and time calculator">

  <title>Bandwidth Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --surface-selected: #eff6ff;

      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --border: #e2e8f0;
      --border-light: #f1f5f9;

      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #dbeafe;

      --success: #059669;

      --shadow-sm: 0 1px 2px rgb(15 23 42 / 4%);
      --shadow-md: 0 4px 16px rgb(15 23 42 / 7%);

      --radius-sm: 7px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --content-width: 1280px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(var(--content-width), calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 32px;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .page-header h1 {
      margin: 0;

      color: var(--text);

      font-size: clamp(1.6rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.15;
    }

    .page-description {
      max-width: 620px;
      margin: 8px 0 0;

      color: var(--text-secondary);
      font-size: .95rem;
    }

    .calculator-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .calculator-card {
      min-width: 0;
      overflow: hidden;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow: var(--shadow-md);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 48px;
      padding: 0 16px;

      background: var(--surface);

      border-bottom: 1px solid var(--border);
    }

    .card-title {
      margin: 0;

      color: var(--text);

      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .card-badge {
      padding: 3px 7px;

      border: 1px solid var(--primary-soft);
      border-radius: 5px;

      background: #f8fbff;
      color: var(--primary);

      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .input-section {
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .input-wrapper {
      position: relative;
    }

    .value-input {
      width: 100%;
      height: 58px;

      padding: 0 14px;

      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);

      background: #fff;
      color: var(--text);

      font-family: "JetBrains Mono", monospace;
      font-size: 1.25rem;
      font-weight: 600;

      text-align: right;

      outline: none;

      transition:
        border-color .15s ease,
        box-shadow .15s ease,
        background .15s ease;
    }

    .value-input::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    .value-input:hover {
      border-color: #94a3af;
    }

    .value-input:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgb(37 99 235 / 12%);
    }

    .selected-unit {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      min-height: 24px;
      margin-top: 7px;

      color: var(--text-muted);

      font-size: .75rem;
      font-weight: 500;
    }

    .unit-list {
      margin: 0;
      padding: 6px 0;

      list-style: none;
    }

    .unit-row {
      position: relative;

      margin: 2px 6px;

      border-radius: 7px;

      transition:
        background .12s ease,
        box-shadow .12s ease;
    }

    .unit-row:hover {
      background: var(--surface-hover);
    }

    .unit-row:has(input:checked) {
      background: var(--surface-selected);
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .unit-label {
      display: grid;

      /*
        Left:
        1. value
        2. unit
        3. description
        4. radio
      */
      grid-template-columns:
        minmax(0, 1fr)
        48px
        minmax(0, 90px)
        22px;

      align-items: center;
      gap: 8px;

      min-height: 38px;
      padding: 5px 10px;

      cursor: pointer;
    }

    .unit-value {
      min-width: 0;

      color: var(--primary);

      font-family: "JetBrains Mono", monospace;
      font-size: .78rem;
      font-weight: 600;

      text-align: left;
      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unit-row:has(input:checked) .unit-value {
      color: var(--primary-dark);
    }

    .unit-code {
      color: var(--text);

      font-family: "JetBrains Mono", monospace;
      font-size: .82rem;
      font-weight: 700;

      white-space: nowrap;
    }

    .unit-row:has(input:checked) .unit-code {
      color: var(--primary);
    }

    .unit-description {
      min-width: 0;

      overflow: hidden;

      color: var(--text-muted);

      font-size: .78rem;

      text-overflow: ellipsis;
    }

    .unit-label input[type="radio"] {
      width: 15px;
      height: 15px;

      margin: 0;

      justify-self: end;

      accent-color: var(--primary);

      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;

      margin-top: 20px;
    }

    .reset-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-width: 110px;
      min-height: 40px;

      padding: 0 18px;

      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);

      background: var(--surface);
      color: var(--text-secondary);

      font-size: .82rem;
      font-weight: 600;

      cursor: pointer;

      transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .15s ease;
    }

    .reset-button:hover {
      background: var(--surface-hover);
      border-color: #94a3b8;
      color: var(--text);
      transform: translateY(-1px);
    }

    .reset-button:active {
      transform: translateY(0);
    }

    .reset-button:focus-visible {
      outline: 3px solid rgb(37 99 235 / 20%);
      outline-offset: 2px;
    }

    .page-footer {
      margin-top: 24px;

      color: var(--text-muted);

      font-size: .72rem;
      text-align: center;
    }

    @media (max-width: 1000px) {

      .calculator-grid {
        grid-template-columns: 1fr;
      }

      .calculator-card {
        width: 100%;
      }

      .unit-label {
        grid-template-columns:
          minmax(0, 90px)
          48px
          minmax(0, 1fr)
          22px;
      }
    }


    @media (max-width: 520px) {

      .page {
        width: min(100% - 20px, var(--content-width));
        padding-top: 24px;
      }

      .page-header {
        margin-bottom: 20px;
      }

      .page-description {
        font-size: .88rem;
      }

      .calculator-grid {
        gap: 12px;
      }

      .card-header {
        min-height: 44px;
        padding: 0 14px;
      }

      .card-badge {
        display: none;
      }

      .input-section {
        padding: 14px;
      }

      .value-input {
        height: 54px;
        font-size: 1.1rem;
      }

      .unit-label {
        grid-template-columns:
          minmax(0, 72px)
          40px
          minmax(0, 1fr)
          20px;

        gap: 6px;

        padding: 4px 8px;
      }

      .unit-code {
        font-size: .78rem;
      }

      .unit-description {
        font-size: .74rem;
      }

      .unit-value {
        font-size: .72rem;
      }

      .unit-label input[type="radio"] {
        width: 14px;
        height: 14px;
      }
    }

    @media (prefers-color-scheme: dark) {

      :root {
        color-scheme: dark;

        --bg: #0b1120;
        --surface: #111827;
        --surface-hover: #182235;
        --surface-selected: #10244a;

        --text: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;

        --border: #263244;
        --border-light: #1e293b;

        --primary: #60a5fa;
        --primary-dark: #93c5fd;
        --primary-soft: #1e3a5f;

        --shadow-sm: 0 1px 2px rgb(0 0 0 / 20%);
        --shadow-md: 0 4px 18px rgb(0 0 0 / 25%);
      }

      .card-badge {
        background: #0f2038;
      }

      .value-input {
        background: #0f172a;
        border-color: #334155;
        color: var(--text);
      }

      .value-input:hover {
        border-color: #475569;
      }

      .value-input::placeholder {
        color: #64748b;
      }

      .reset-button {
        background: var(--surface);
        border-color: #334155;
        color: var(--text-secondary);
      }

      .reset-button:hover {
        background: var(--surface-hover);
        border-color: #475569;
        color: var(--text);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="page-header">

      <h1>Bandwidth Calculator</h1>

      <p class="page-description">
        Calculate data size, transfer speed, or transfer time.
        Enter any two values to calculate the third.
      </p>

    </header>

    <div class="calculator-grid">

      <section class="calculator-card">

        <header class="card-header">
          <h2 class="card-title">Data</h2>
          <span class="card-badge">Size</span>
        </header>

        <div class="input-section">

          <div class="input-wrapper">

            <input
              class="value-input"
              id="dataInput"
              type="number"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              placeholder="Enter value"
              aria-label="Data value"
            >

          </div>

          <div
            class="selected-unit"
            id="dataSelectedUnit"
          >
            MB megabytes
          </div>

        </div>

        <ul class="unit-list" id="dataList"></ul>

      </section>

      <section class="calculator-card">

        <header class="card-header">
          <h2 class="card-title">Speed</h2>
          <span class="card-badge">Rate</span>
        </header>

        <div class="input-section">

          <div class="input-wrapper">

            <input
              class="value-input"
              id="speedInput"
              type="number"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              placeholder="Enter value"
              aria-label="Speed value"
            >

          </div>

          <div
            class="selected-unit"
            id="speedSelectedUnit"
          >
            Mbps megabits per second
          </div>

        </div>

        <ul class="unit-list" id="speedList"></ul>

      </section>

      <section class="calculator-card">

        <header class="card-header">
          <h2 class="card-title">Time</h2>
          <span class="card-badge">Duration</span>
        </header>

        <div class="input-section">

          <div class="input-wrapper">

            <input
              class="value-input"
              id="timeInput"
              type="number"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              placeholder="Enter value"
              aria-label="Time value"
            >

          </div>

          <div
            class="selected-unit"
            id="timeSelectedUnit"
          >
            s seconds
          </div>

        </div>

        <ul class="unit-list" id="timeList"></ul>

      </section>

    </div>

    <div class="controls">

      <button
        class="reset-button"
        id="resetButton"
        type="button"
      >
        Reset
      </button>

    </div>

  </main>


  <script>

    const UNITS = {

      data: {
        B: {
          factor: 1,
          name: "bytes"
        },

        KB: {
          factor: 1024,
          name: "kilobytes"
        },

        MB: {
          factor: 1024 ** 2,
          name: "megabytes"
        },

        GB: {
          factor: 1024 ** 3,
          name: "gigabytes"
        },

        TB: {
          factor: 1024 ** 4,
          name: "terabytes"
        },

        b: {
          factor: 1 / 8,
          name: "bits"
        },

        Kb: {
          factor: 1024 / 8,
          name: "kilobits"
        },

        Mb: {
          factor: 1024 ** 2 / 8,
          name: "megabits"
        },

        Gb: {
          factor: 1024 ** 3 / 8,
          name: "gigabits"
        },

        Tb: {
          factor: 1024 ** 4 / 8,
          name: "terabits"
        }
      },


      speed: {
        bps: {
          factor: 1,
          name: "bits per second"
        },

        Kbps: {
          factor: 1024,
          name: "kilobits per second"
        },

        Mbps: {
          factor: 1024 ** 2,
          name: "megabits per second"
        },

        Gbps: {
          factor: 1024 ** 3,
          name: "gigabits per second"
        },

        Bps: {
          factor: 8,
          name: "bytes per second"
        },

        KBps: {
          factor: 8 * 1024,
          name: "kilobytes per second"
        },

        MBps: {
          factor: 8 * 1024 ** 2,
          name: "megabytes per second"
        },

        TBps: {
          factor: 8 * 1024 ** 3,
          name: "terabytes per second"
        }
      },


      time: {
        ns: {
          factor: 1e-9,
          name: "nanoseconds"
        },

        ms: {
          factor: 1e-3,
          name: "milliseconds"
        },

        s: {
          factor: 1,
          name: "seconds"
        },

        m: {
          factor: 60,
          name: "minutes"
        },

        h: {
          factor: 3600,
          name: "hours"
        },

        d: {
          factor: 86400,
          name: "days"
        },

        w: {
          factor: 604800,
          name: "weeks"
        },

        y: {
          factor: 31536000,
          name: "years"
        }
      }

    };

    const DEFAULTS = {
      data: "GB",
      speed: "Gbps",
      time: "m"
    };

    const inputs = {
      data: document.getElementById("dataInput"),
      speed: document.getElementById("speedInput"),
      time: document.getElementById("timeInput")
    };

    const lists = {
      data: document.getElementById("dataList"),
      speed: document.getElementById("speedList"),
      time: document.getElementById("timeList")
    };

    const selectedUnitLabels = {
      data: document.getElementById("dataSelectedUnit"),
      speed: document.getElementById("speedSelectedUnit"),
      time: document.getElementById("timeSelectedUnit")
    };

    const formatNumber = value => {

      if (!Number.isFinite(value)) {
        return "";
      }

      const rounded = Number(value.toFixed(6));

      return new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 6,
        useGrouping: true
      }).format(rounded);
    };

    const getSelectedUnit = type => {

      return document.querySelector(
        `input[name="${type}"]:checked`
      )?.value;

    };


    const getSelectedUnits = () => {

      return {
        data: getSelectedUnit("data"),
        speed: getSelectedUnit("speed"),
        time: getSelectedUnit("time")
      };

    };


    const updateSelectedUnitLabels = () => {

      const selected = getSelectedUnits();

      Object.entries(selected).forEach(
        ([type, unit]) => {

          if (!unit) {
            return;
          }

          selectedUnitLabels[type].textContent =
            `${unit} ${UNITS[type][unit].name}`;

        }
      );

    };

    const createUnitRow = (type, unit) => {

      const definition = UNITS[type][unit];

      const li = document.createElement("li");

      li.className = "unit-row";
      li.dataset.unit = unit;


      li.innerHTML = `
        <label class="unit-label">

          <span
            class="unit-value"
            id="value-${type}-${unit}"
          ></span>

          <span class="unit-code">
            ${unit}
          </span>

          <span class="unit-description">
            ${definition.name}
          </span>

          <input
            type="radio"
            name="${type}"
            value="${unit}"
          >

        </label>
      `;

      return li;
    };


    const buildUnitLists = () => {

      Object.keys(UNITS).forEach(type => {

        lists[type].innerHTML = "";

        Object.keys(UNITS[type]).forEach(unit => {

          lists[type].appendChild(
            createUnitRow(type, unit)
          );

        });

      });

    };

    const getInputValue = type => {

      const value = Number(inputs[type].value);

      return Number.isFinite(value) && value > 0
        ? value
        : 0;

    };

    const updateCalculator = () => {

      const selected = getSelectedUnits();

      if (
        !selected.data ||
        !selected.speed ||
        !selected.time
      ) {
        return;
      }

      const dataValue = getInputValue("data");
      const speedValue = getInputValue("speed");
      const timeValue = getInputValue("time");

      let bits = 0;
      let bitsPerSecond = 0;
      let seconds = 0;

      if (dataValue && speedValue) {

        bits =
          dataValue *
          UNITS.data[selected.data].factor;

        bitsPerSecond =
          speedValue *
          UNITS.speed[selected.speed].factor;

        seconds =
          bits / bitsPerSecond;

      }

      else if (dataValue && timeValue) {

        bits =
          dataValue *
          UNITS.data[selected.data].factor;

        seconds =
          timeValue *
          UNITS.time[selected.time].factor;

        bitsPerSecond =
          bits / seconds;

      }

      else if (speedValue && timeValue) {

        bitsPerSecond =
          speedValue *
          UNITS.speed[selected.speed].factor;

        seconds =
          timeValue *
          UNITS.time[selected.time].factor;

        bits =
          bitsPerSecond *
          seconds;

      }


      else {

        clearResults();

        return;

      }


      updateDataResults(bits);
      updateSpeedResults(bitsPerSecond);
      updateTimeResults(seconds);

    };

    const updateDataResults = bits => {

      Object.entries(UNITS.data).forEach(
        ([unit, definition]) => {

          const element =
            document.getElementById(
              `value-data-${unit}`
            );

          element.textContent =
            formatNumber(
              bits / definition.factor
            );

        }
      );

    };


    const updateSpeedResults = bitsPerSecond => {

      Object.entries(UNITS.speed).forEach(
        ([unit, definition]) => {

          const element =
            document.getElementById(
              `value-speed-${unit}`
            );

          element.textContent =
            formatNumber(
              bitsPerSecond / definition.factor
            );

        }
      );

    };


    const updateTimeResults = seconds => {

      Object.entries(UNITS.time).forEach(
        ([unit, definition]) => {

          const element =
            document.getElementById(
              `value-time-${unit}`
            );

          element.textContent =
            formatNumber(
              seconds / definition.factor
            );

        }
      );

    };


    const clearResults = () => {

      document.querySelectorAll(".unit-value").forEach(
        element => {
          element.textContent = "";
        }
      );

    };

    const resetCalculator = () => {

      inputs.data.value = "";
      inputs.speed.value = "";
      inputs.time.value = "";

      document.querySelectorAll(
        'input[type="radio"]'
      ).forEach(input => {
        input.checked = false;
      });


      Object.entries(DEFAULTS).forEach(
        ([type, unit]) => {

          const input = document.querySelector(
            `input[name="${type}"][value="${unit}"]`
          );

          if (input) {
            input.checked = true;
          }

        }
      );


      clearResults();
      updateSelectedUnitLabels();

      inputs.data.focus();

    };

    Object.values(inputs).forEach(input => {

      input.addEventListener(
        "input",
        updateCalculator
      );

    });


    document.addEventListener(
      "change",
      event => {

        if (
          event.target.matches(
            'input[type="radio"]'
          )
        ) {

          updateSelectedUnitLabels();
          updateCalculator();

        }

      }
    );


    document.getElementById(
      "resetButton"
    ).addEventListener(
      "click",
      resetCalculator
    );

    buildUnitLists();

    Object.entries(DEFAULTS).forEach(
      ([type, unit]) => {

        const input = document.querySelector(
          `input[name="${type}"][value="${unit}"]`
        );

        if (input) {
          input.checked = true;
        }

      }
    );

    updateSelectedUnitLabels();

  </script>

</body>
</html>
